<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NOpartisan</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><img class="mark" src="Blue NOP Tech Logo.png" width="52" height="52" alt=""><div><h1>NOpartisan</h1><p>No left. No right. No thanks.</p></div></header>
  <main>
    <label class="toggle" for="enabled">
      <span><strong>Filter political content</strong><small id="enabledHint">Applies to all supported sites</small></span>
      <input type="checkbox" id="enabled" aria-describedby="enabledHint" disabled>
    </label>
    <label class="toggle" for="showPlaceholders">
      <span><strong>Show placeholders</strong><small id="placeholderHint">Turn off to hide content completely</small></span>
      <input type="checkbox" id="showPlaceholders" aria-describedby="placeholderHint" disabled>
    </label>
    <p id="status" role="status" aria-live="polite">Loading settings…</p>
    <button type="button" id="settings">Open full settings <span aria-hidden="true">→</span></button>
    <p class="privacy">Right-click an X post → “Why is this post visible?”<br>Filtering and inspection stay on your device.</p>
  </main>
  <script src="core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
